<!doctype html>
<html>
<head><meta charset="utf-8"><title>webview-esm spike</title></head>
<body>
<iframe sandbox="allow-scripts" id="f" srcdoc="
<script type='module'>
  try {
    const React = await import('https://esm.sh/react@18.3.1');
    const mermaid = await import('https://esm.sh/mermaid@11.4.0');
    // esm.sh exposes the module as the default export. For React 18 that's
    // a function (the createElement factory); for Mermaid 11 it's an API
    // object with an `initialize` method. Either being truthy + the
    // expected shape means the WebView can fetch and parse the module.
    const reactReady = !!(React && React.default);
    const mermaidReady = !!(mermaid && mermaid.default && typeof mermaid.default.initialize === 'function');
    if (reactReady && mermaidReady) {
      parent.postMessage({type:'artifact:ready', react: true, mermaid: true}, '*');
    } else {
      parent.postMessage({type:'artifact:error', message: 'reactReady='+reactReady+', mermaidReady='+mermaidReady}, '*');
    }
  } catch (e) {
    parent.postMessage({type:'artifact:error', message: String(e && e.message || e)}, '*');
  }
</script>
"></iframe>
<pre id="log"></pre>
<script>
  window.addEventListener('message', (e) => {
    document.getElementById('log').textContent = JSON.stringify(e.data);
    console.log('[spike]', e.data);
  });
</script>
</body>
</html>
